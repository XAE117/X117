name: Scrape & Notify

on:
  schedule:
    - cron: '0 10 * * *'   # Daily 2am PT — cinema + jazz
    - cron: '0 0 * * 6'    # Friday 4pm PT — restaurants + weekly digest
    - cron: '0 9 * * 0'    # Sunday 1am PT — WEEKLY DEEP REFRESH (everything)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci
      - name: Install Puppeteer Chrome
        continue-on-error: true
        run: npx puppeteer browsers install chrome
      - name: Scrape theater data and send SMS alerts
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run scrape
      - name: Scrape jazz data
        run: npm run scrape:jazz
      - name: Scrape restaurant data (weekly + Fridays)
        if: github.event.schedule == '0 0 * * 6' || github.event.schedule == '0 9 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: npm run scrape:eats
      - name: Send weekly digest (Fridays only)
        if: github.event.schedule == '0 0 * * 6'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: node scripts/weekly-digest.js
      - name: Validate data
        if: always()
        run: |
          set +e
          node scripts/validate-data.js
          validation_status=$?
          set -e

          # Exit 1 means the data is usable but has health warnings.
          # Exit 2 means a critical floor/freshness check failed.
          if [ "$validation_status" -ge 2 ]; then
            exit "$validation_status"
          fi
      - name: Commit updated data
        id: commit_data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/theaters.json public/jazz-venues.json public/restaurants.json public/scrape-log.json public/health-report.md
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
          else
            git commit -m "Update screening, jazz, and restaurant data"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes from GITHUB_TOKEN cannot trigger other workflows, so the
      # daily data push silently never re-deploys Pages. We trigger the
      # deploy workflow explicitly here. workflow_dispatch events DO
      # trigger from a GITHUB_TOKEN-authenticated gh CLI call.
      #
      # We gate on commit_data.outputs.committed rather than job success so
      # successfully generated data can still deploy if a later step fails.
      - name: Trigger Pages deploy
        if: always() && steps.commit_data.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main -R ${{ github.repository }}

      # A silently failing scrape is how we ended up shipping 4 theaters to
      # production for a week. Make any failure visible in the Actions log.
      - name: Report scrape failure
        if: failure()
        run: |
          echo "::error title=Scrape workflow failed::One or more scrape or critical validation steps exited non-zero."
          echo "Successfully generated files may still have been committed by the cleanup step."
          echo "Inspect the first failed step above for the root cause."
