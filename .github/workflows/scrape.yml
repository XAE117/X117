name: Scrape & Notify

on:
  schedule:
    - cron: '0 10 * * *'   # Daily at 10am UTC (2am PT)
    - cron: '0 0 * * 6'    # Weekly digest Fridays at 4pm PT (midnight UTC Saturday)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci
      - name: Scrape theater data and send SMS alerts
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run scrape
      - name: Scrape jazz data
        run: npm run scrape:jazz
      - name: Scrape restaurant data (Fridays only)
        if: github.event.schedule == '0 0 * * 6' || github.event_name == 'workflow_dispatch'
        run: npm run scrape:eats
      - name: Send weekly digest (Fridays only)
        if: github.event.schedule == '0 0 * * 6'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: node scripts/weekly-digest.js
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/theaters.json public/jazz-venues.json public/restaurants.json public/scrape-log.json
          git diff --cached --quiet || git commit -m "Update screening, jazz, and restaurant data"
          git push

      # Pushes from GITHUB_TOKEN cannot trigger other workflows, so the
      # daily data push silently never re-deploys Pages. We trigger the
      # deploy workflow explicitly here. workflow_dispatch events DO
      # trigger from a GITHUB_TOKEN-authenticated gh CLI call.
      - name: Trigger Pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main -R ${{ github.repository }}
