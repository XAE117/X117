<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0E4B8"/>
      <stop offset="30%" stop-color="#D4B55E"/>
      <stop offset="70%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8C6E28"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#C9A84C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="23" height="23" patternUnits="userSpaceOnUse">
      <rect x="4" y="2" width="1" height="1" fill="#000" opacity="0.13"/>
      <rect x="17" y="6" width="1" height="1" fill="#fff" opacity="0.06"/>
      <rect x="9" y="12" width="1" height="1" fill="#000" opacity="0.11"/>
      <rect x="1" y="18" width="1" height="1" fill="#fff" opacity="0.05"/>
      <rect x="21" y="1" width="1" height="1" fill="#000" opacity="0.09"/>
      <rect x="13" y="9" width="1" height="1" fill="#000" opacity="0.12"/>
      <rect x="6" y="20" width="1" height="1" fill="#fff" opacity="0.05"/>
      <rect x="15" y="16" width="1" height="1" fill="#000" opacity="0.1"/>
      <rect x="0" y="7" width="1" height="1" fill="#000" opacity="0.08"/>
      <rect x="20" y="14" width="1" height="1" fill="#fff" opacity="0.04"/>
      <rect x="10" y="0" width="1" height="1" fill="#000" opacity="0.12"/>
      <rect x="3" y="15" width="1" height="1" fill="#000" opacity="0.07"/>
      <rect x="22" y="10" width="1" height="1" fill="#fff" opacity="0.05"/>
      <rect x="14" y="4" width="1" height="1" fill="#000" opacity="0.09"/>
      <rect x="7" y="22" width="1" height="1" fill="#000" opacity="0.11"/>
      <rect x="18" y="19" width="1" height="1" fill="#fff" opacity="0.04"/>
      <rect x="2" y="8" width="1" height="1" fill="#000" opacity="0.1"/>
      <rect x="16" y="13" width="1" height="1" fill="#000" opacity="0.08"/>
      <rect x="11" y="5" width="1" height="1" fill="#fff" opacity="0.06"/>
      <rect x="5" y="11" width="1" height="1" fill="#000" opacity="0.13"/>
      <rect x="19" y="3" width="1" height="1" fill="#000" opacity="0.07"/>
      <rect x="8" y="17" width="1" height="1" fill="#fff" opacity="0.05"/>
    </pattern>

    <path id="letterL" d="M 58,96 H 140 V 112 H 112 V 356 H 235 V 416 H 58 Z"/>
    <path id="letterP" d="M 277,96 H 454 V 262 H 331 V 396 H 368 V 416 H 277 Z M 331,144 H 400 V 214 H 331 Z"/>

    <clipPath id="letterClip">
      <use href="#letterL"/>
      <use href="#letterP"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#0D0B0A"/>
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Outer glow (layer 3) -->
  <g opacity="0.035">
    <path d="M 40,78 H 158 V 94 H 94 V 338 H 253 V 434 H 40 Z" fill="#D4B55E"/>
    <path d="M 259,78 H 472 V 280 H 313 V 414 H 386 V 434 H 259 Z" fill="#D4B55E"/>
  </g>
  <!-- Glow layer 2 -->
  <g opacity="0.065">
    <path d="M 46,84 H 152 V 100 H 100 V 344 H 247 V 428 H 46 Z" fill="#D4B55E"/>
    <path d="M 265,84 H 466 V 274 H 319 V 408 H 380 V 428 H 265 Z" fill="#D4B55E"/>
  </g>
  <!-- Inner glow (layer 1) -->
  <g opacity="0.11">
    <path d="M 52,90 H 146 V 106 H 106 V 350 H 241 V 422 H 52 Z" fill="#E8D5A3"/>
    <path d="M 271,90 H 460 V 268 H 325 V 402 H 374 V 422 H 271 Z" fill="#E8D5A3"/>
  </g>

  <!-- Main LP letters -->
  <use href="#letterL" fill="url(#gold)"/>
  <use href="#letterP" fill="url(#gold)" fill-rule="evenodd"/>

  <!-- Grain overlay -->
  <rect width="512" height="512" fill="url(#grain)" clip-path="url(#letterClip)"/>

  <!-- Art Deco inline details -->
  <g opacity="0.16" fill="#0D0B0A">
    <rect x="82" y="118" width="3" height="234"/>
    <rect x="64" y="384" width="167" height="3"/>
    <rect x="301" y="118" width="3" height="294"/>
    <rect x="337" y="118" width="111" height="3"/>
    <rect x="424" y="118" width="3" height="92"/>
    <rect x="337" y="236" width="111" height="3"/>
  </g>

  <!-- Bright top/left edge highlights -->
  <g opacity="0.2" fill="none" stroke="#F0E4B8" stroke-width="1">
    <line x1="58" y1="96" x2="140" y2="96"/>
    <line x1="58" y1="96" x2="58" y2="416"/>
    <line x1="277" y1="96" x2="454" y2="96"/>
    <line x1="277" y1="96" x2="277" y2="416"/>
  </g>

  <!-- Stepped corner brackets -->
  <g fill="none" stroke="#C9A84C" opacity="0.45">
    <polyline points="20,68 20,20 68,20" stroke-width="3"/>
    <polyline points="38,50 38,38 50,38" stroke-width="1.5"/>
    <polyline points="444,20 492,20 492,68" stroke-width="3"/>
    <polyline points="462,38 474,38 474,50" stroke-width="1.5"/>
    <polyline points="20,444 20,492 68,492" stroke-width="3"/>
    <polyline points="38,462 38,474 50,474" stroke-width="1.5"/>
    <polyline points="492,444 492,492 444,492" stroke-width="3"/>
    <polyline points="474,462 474,474 462,474" stroke-width="1.5"/>
  </g>

  <!-- Horizontal accent lines -->
  <line x1="80" y1="64" x2="432" y2="64" stroke="#C9A84C" stroke-width="1" opacity="0.2"/>
  <line x1="80" y1="448" x2="432" y2="448" stroke="#C9A84C" stroke-width="1" opacity="0.2"/>

  <!-- Diamond accents -->
  <polygon points="256,58 261,64 256,70 251,64" fill="#C9A84C" opacity="0.3"/>
  <polygon points="256,442 261,448 256,454 251,448" fill="#C9A84C" opacity="0.3"/>
</svg>
