<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur1"/>
      <feFlood flood-color="#C9A84C" flood-opacity="0.5"/>
      <feComposite in2="blur1" operator="in" result="outerGlow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur2"/>
      <feFlood flood-color="#EEDFA0" flood-opacity="0.4"/>
      <feComposite in2="blur2" operator="in" result="innerGlow"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="overlay" result="grained"/>
      <feMerge>
        <feMergeNode in="outerGlow"/>
        <feMergeNode in="innerGlow"/>
        <feMergeNode in="grained"/>
      </feMerge>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDE0B1"/>
      <stop offset="40%" stop-color="#D4B55E"/>
      <stop offset="100%" stop-color="#9A7B30"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="#0D0B0A"/>

  <!-- Minimal corner brackets -->
  <g fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.45">
    <polyline points="3,10 3,3 10,3"/>
    <polyline points="54,3 61,3 61,10"/>
    <polyline points="3,54 3,61 10,61"/>
    <polyline points="61,54 61,61 54,61"/>
  </g>

  <!-- LP Letters -->
  <g filter="url(#glow)">
    <!-- L -->
    <path d="M 12,14 H 17 V 44 H 30 V 50 H 12 Z" fill="url(#gold)"/>
    <!-- P -->
    <path d="M 34,14 H 52 V 34 H 39 V 50 H 34 Z M 39,19 H 47 V 29 H 39 Z" fill="url(#gold)" fill-rule="evenodd"/>
  </g>
</svg>
