<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0E4B8"/>
      <stop offset="35%" stop-color="#D4B55E"/>
      <stop offset="100%" stop-color="#8C6E28"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#C9A84C" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>

    <path id="letterL" d="M 8,12 H 15 V 14 H 14 V 45 H 30 V 52 H 8 Z"/>
    <path id="letterP" d="M 35,12 H 56 V 33 H 41 V 49 H 46 V 52 H 35 Z M 41,18 H 50 V 27 H 41 Z"/>

    <clipPath id="lc">
      <use href="#letterL"/>
      <use href="#letterP"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" fill="#0D0B0A"/>
  <rect width="64" height="64" fill="url(#bgGlow)"/>

  <!-- Glow halos -->
  <g opacity="0.06">
    <path d="M 5,9 H 18 V 11 H 11 V 42 H 33 V 55 H 5 Z" fill="#D4B55E"/>
    <path d="M 32,9 H 59 V 36 H 38 V 52 H 49 V 55 H 32 Z" fill="#D4B55E"/>
  </g>
  <g opacity="0.12">
    <path d="M 6,10 H 17 V 12 H 12 V 43 H 32 V 54 H 6 Z" fill="#E8D5A3"/>
    <path d="M 33,10 H 58 V 35 H 39 V 51 H 48 V 54 H 33 Z" fill="#E8D5A3"/>
  </g>

  <!-- Main letters -->
  <use href="#letterL" fill="url(#gold)"/>
  <use href="#letterP" fill="url(#gold)" fill-rule="evenodd"/>

  <!-- Grain -->
  <pattern id="grain" width="11" height="11" patternUnits="userSpaceOnUse">
    <rect x="2" y="1" width="1" height="1" fill="#000" opacity="0.12"/>
    <rect x="8" y="4" width="1" height="1" fill="#fff" opacity="0.06"/>
    <rect x="5" y="8" width="1" height="1" fill="#000" opacity="0.1"/>
    <rect x="0" y="6" width="1" height="1" fill="#000" opacity="0.08"/>
    <rect x="10" y="9" width="1" height="1" fill="#fff" opacity="0.05"/>
    <rect x="3" y="10" width="1" height="1" fill="#000" opacity="0.11"/>
    <rect x="7" y="2" width="1" height="1" fill="#000" opacity="0.09"/>
    <rect x="9" y="7" width="1" height="1" fill="#fff" opacity="0.05"/>
    <rect x="1" y="5" width="1" height="1" fill="#000" opacity="0.1"/>
    <rect x="6" y="0" width="1" height="1" fill="#000" opacity="0.07"/>
  </pattern>
  <rect width="64" height="64" fill="url(#grain)" clip-path="url(#lc)"/>

  <!-- Corner brackets -->
  <g fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.4">
    <polyline points="3,9 3,3 9,3"/>
    <polyline points="55,3 61,3 61,9"/>
    <polyline points="3,55 3,61 9,61"/>
    <polyline points="61,55 61,61 55,61"/>
  </g>
</svg>
