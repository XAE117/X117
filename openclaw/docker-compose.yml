# OpenClaw Stage 1: Hardened Docker Environment
# This compose file creates the secure container environment ONLY.
# OpenClaw itself is NOT installed here -- that's Stage 2.
#
# Hardening rationale:
#   - read_only rootfs prevents runtime tampering
#   - cap_drop ALL + no-new-privileges blocks privilege escalation
#   - 127.0.0.1 binding ensures gateway is never publicly exposed
#   - Tailscale provides the only external access path
#   - tmpfs for /tmp prevents disk-based persistence of temp data
#   - Resource limits prevent runaway processes
#
# CVE-2026-25253 mitigations:
#   - Gateway bound to loopback only (no LAN/WAN exposure)
#   - Control UI port NOT exposed (dashboard disabled until Stage 2)
#   - WebSocket origin validation enforced in openclaw.json (Stage 2)

services:
  openclaw-gateway:
    image: openclaw:local
    container_name: openclaw-gateway
    restart: unless-stopped

    # --- Security hardening ---
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Minimal capabilities needed for node process
    cap_add:
      - NET_BIND_SERVICE

    # --- Resource limits ---
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m
          cpus: "0.5"
    pids_limit: 512

    # --- Network: loopback only ---
    # Gateway listens on 127.0.0.1 -- only reachable from the host.
    # External access is via Tailscale only (see setup-tailscale.sh).
    ports:
      - "127.0.0.1:18789:18789"   # Dashboard/API (localhost only)
      - "127.0.0.1:1455:1455"     # OAuth callback (localhost only)
    networks:
      - openclaw-internal

    # --- Filesystem ---
    # Writable tmpfs for temp files; everything else is read-only
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
      - /var/tmp:size=128m,noexec,nosuid,nodev
      - /run:size=64m,noexec,nosuid,nodev

    volumes:
      # OpenClaw config -- read-only bind mount
      - ./config:/home/node/.openclaw:ro
      # State directory -- this is the only writable persistent volume
      - openclaw-state:/home/node/.openclaw-state
      # Workspace for agent sandboxes
      - openclaw-workspace:/home/node/.openclaw/workspace

    # --- Credentials via environment ---
    # All secrets come from .env file, never baked into image.
    # See .env.template for required variables.
    env_file:
      - .env

    environment:
      - OPENCLAW_HOME=/home/node/.openclaw
      - OPENCLAW_STATE_DIR=/home/node/.openclaw-state
      - NODE_ENV=production

    # --- Health check ---
    healthcheck:
      test: ["CMD", "node", "dist/index.js", "health", "--token", "$OPENCLAW_GATEWAY_TOKEN"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # --- Logging ---
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Sandbox container (used by gateway for agent execution) ---
  openclaw-sandbox:
    image: openclaw-sandbox:bookworm-slim
    container_name: openclaw-sandbox
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Sandbox is fully isolated -- no network by default
    network_mode: "none"

    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    pids_limit: 256

    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
      - /var/tmp:size=128m,noexec,nosuid,nodev
      - /run:size=64m,noexec,nosuid,nodev

    volumes:
      - openclaw-workspace:/workspace

    ulimits:
      nofile:
        soft: 1024
        hard: 2048
      nproc: 256

    # Sandbox is managed by the gateway -- no independent startup
    profiles:
      - sandbox

networks:
  openclaw-internal:
    driver: bridge
    internal: true   # No outbound internet from this network

volumes:
  openclaw-state:
    driver: local
  openclaw-workspace:
    driver: local
